# Nginx 全局压缩：4Mbps 带宽下最有效的提速手段
# 注意：Ubuntu 的 nginx.conf 已内置 "gzip on;"，此处只补充参数，切勿重复声明。
#
# gzip_static：优先发送构建期预压缩的 .gz（零 CPU 开销）。
# Pyodide 的 pyodide.asm.wasm 有 9.2MB，预压缩后约 3MB，首屏加载时间直接砍掉 2/3。
gzip_static on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/wasm
    image/svg+xml;

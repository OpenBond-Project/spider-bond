# 证书签发后的配置：域名走 HTTPS，IP 仍保留 HTTP 直连
# 由 deploy/issue-cert.sh 自动启用

# 1) IP / 未知 Host：保持 HTTP 反代，方便直接通过公网 IP 访问
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location ^~ /assets/ {
        alias /opt/spiderlab/dist/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 固定文件名的共享资源：不能长缓存。曾因 30 天 immutable 导致样式更新后
    # 浏览器一直用旧版（夜间模式修复"不生效"就是这个原因）。
    location = /assets/theme.css {
        root /opt/spiderlab/dist;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /assets/highlight.js {
        root /opt/spiderlab/dist;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Pyodide / WASM 运行时（长缓存，按需懒加载）
    location ^~ /pyodide/ {
        alias /opt/spiderlab/dist/pyodide/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        types {
            application/wasm                 wasm;
            application/javascript           js mjs;
            application/zip                   zip;
            application/json                 json;
            application/octet-stream           whl;
        }
        default_type application/octet-stream;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}

# 2) 域名 80：ACME 续期保留，其余跳转 HTTPS
server {
    listen 80;
    server_name spider.skkk.uno;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 3) 域名 443
server {
    listen 443 ssl;
    http2 on;
    server_name spider.skkk.uno;

    ssl_certificate     /etc/letsencrypt/live/spider.skkk.uno/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spider.skkk.uno/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    # HSTS：两年 + 覆盖子域 + 声明可预加载。
    # 从 spider.skkk.uno 返回的头只作用于 *.spider.skkk.uno（本站没有子域），
    # 不会波及 mail / wanai / www 这些兄弟子域，所以 includeSubDomains 是安全的。
    # preload 只是表态，真正进入浏览器预加载列表需要另行到 hstspreload.org 提交。
    #
    # 分工：nosniff / Referrer-Policy 由应用层（app.py 的 _send）统一下发，
    # 这里不再重复——server 级 add_header 会给代理响应再加一遍，形成重复头。
    # 静态资源段自己带 nosniff，因为它们不经过应用层。
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location ^~ /assets/ {
        alias /opt/spiderlab/dist/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 固定文件名的共享资源：不能长缓存。曾因 30 天 immutable 导致样式更新后
    # 浏览器一直用旧版（夜间模式修复"不生效"就是这个原因）。
    location = /assets/theme.css {
        root /opt/spiderlab/dist;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /assets/highlight.js {
        root /opt/spiderlab/dist;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Pyodide / WASM 运行时（长缓存，按需懒加载）
    location ^~ /pyodide/ {
        alias /opt/spiderlab/dist/pyodide/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        types {
            application/wasm                 wasm;
            application/javascript           js mjs;
            application/zip                   zip;
            application/json                 json;
            application/octet-stream           whl;
        }
        default_type application/octet-stream;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}

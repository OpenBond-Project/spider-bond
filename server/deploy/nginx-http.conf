# 证书签发前的 80 端口配置：域名与 IP 都可访问，ACME 验证目录已就绪
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name spider.skkk.uno _;

    # Let's Encrypt HTTP-01 验证
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 静态资源由 Nginx 直接服务（含 Vue 构建产物与 Bootstrap / Lucide）
    location ^~ /assets/ {
        alias /opt/spiderlab/dist/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 固定文件名的共享资源：不能长缓存。曾因 30 天 immutable 导致样式更新后
    # 浏览器一直用旧版（夜间模式修复"不生效"就是这个原因）。
    location = /assets/theme.css {
        root /opt/spiderlab/dist;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /assets/highlight.js {
        root /opt/spiderlab/dist;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Pyodide / WASM 运行时（15MB，长缓存，按需懒加载）
    location ^~ /pyodide/ {
        alias /opt/spiderlab/dist/pyodide/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, immutable";
        types {
            application/wasm                 wasm;
            application/javascript           js mjs;
            application/zip                   zip;
            application/json                 json;
            application/octet-stream           whl;
        }
        default_type application/octet-stream;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
